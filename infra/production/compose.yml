name: bault

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-node: &node
  restart: unless-stopped
  networks: [internal]
  logging: *logging
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:
    - type: bind
      source: ${BAULT_ENV_DIR:-/etc/bault}/db-ca.crt
      target: /etc/bault/db-ca.crt
      read_only: true
      bind:
        create_host_path: false

services:
  caddy:
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - "${BAULT_HTTP_PORT:-80}:80"
      - "${BAULT_HTTPS_PORT:-443}:443"
      - "${BAULT_HTTPS_PORT:-443}:443/udp"
    environment:
      BAULT_DOMAIN: ${BAULT_DOMAIN:?set BAULT_DOMAIN in production.env}
      BAULT_TRUSTED_PROXIES: ${BAULT_TRUSTED_PROXIES:-}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    mem_limit: 128m
    logging: *logging
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${BAULT_REGISTRY:?set BAULT_REGISTRY in production.env}/bault-web:${BAULT_TAG:?set BAULT_TAG (deploy.sh does)}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT in production.env}
      STORAGE_PUBLIC_ORIGIN: ${STORAGE_PUBLIC_ORIGIN:-}
    networks: [internal]
    mem_limit: 64m
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
        restart: true

  api:
    <<: *node
    image: ${BAULT_REGISTRY}/bault-api:${BAULT_TAG}
    env_file:
      - path: ${BAULT_ENV_DIR:-/etc/bault}/production.env
      - path: ${BAULT_ENV_DIR:-/etc/bault}/api.env
    environment:
      API_PORT: "3000"
    mem_limit: 768m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  worker:
    <<: *node
    image: ${BAULT_REGISTRY}/bault-worker:${BAULT_TAG}
    env_file:
      - path: ${BAULT_ENV_DIR:-/etc/bault}/production.env
      - path: ${BAULT_ENV_DIR:-/etc/bault}/worker.env
    mem_limit: 512m
    stop_grace_period: 45s

  migrate:
    <<: *node
    image: ${BAULT_REGISTRY}/bault-api:${BAULT_TAG}
    restart: "no"
    profiles: [migrate]
    env_file:
      - path: ${BAULT_ENV_DIR:-/etc/bault}/production.env
      - path: ${BAULT_ENV_DIR:-/etc/bault}/migrate.env
    command: ["node", "dist/db/migrate.js"]
    mem_limit: 512m

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.89.0/24

volumes:
  caddy_data: {}
  caddy_config: {}
