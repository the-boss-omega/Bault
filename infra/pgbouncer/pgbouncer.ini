; Reference PgBouncer configuration (T006 scaffold; validated/tuned in T134).
; The docker-compose service uses env vars; this file documents the equivalent
; settings for a non-Docker / production deployment.
[databases]
bault = host=127.0.0.1 port=5432 dbname=bault

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction pooling: a server connection is returned to the pool at the end of
; each transaction. Correct for this app because every unit of work is a short,
; self-contained transaction. (Session-level features like LISTEN/NOTIFY must use
; the DIRECT 5432 connection — that is why pg-boss and migrations bypass PgBouncer.)
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
