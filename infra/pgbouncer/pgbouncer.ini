; Reference PgBouncer configuration (T006 scaffold; validated/tuned in T134).
; The docker-compose service uses env vars; this file documents the equivalent
; settings for a non-Docker / production deployment.
[databases]
bault = host=127.0.0.1 port=5432 dbname=bault

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction pooling: a server connection is returned to the pool at the end of
; each transaction. Correct for this app because every unit of work is a short,
; self-contained transaction. Session-level features (SET, LISTEN, session
; advisory locks) would not survive it; the app uses none. Migrations and the
; worker connect to 5432 directly. A client must not send session settings as
; startup parameters either: PgBouncer refuses them (apps/api/src/db/client.ts).
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
