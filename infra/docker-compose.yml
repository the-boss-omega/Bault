services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bault
      POSTGRES_PASSWORD: bault
      POSTGRES_DB: bault
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/dev-settings.sql:/docker-entrypoint-initdb.d/dev-settings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bault -d bault"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: "postgres://bault:bault@postgres:5432/bault"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    build: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
