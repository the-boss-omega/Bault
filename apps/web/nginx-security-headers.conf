# =============================================================================
# The security headers, in one place, included by EVERY location in nginx.conf.
#
# They used to sit once at the `server` level, and that is where nginx's
# inheritance rule quietly removed them: a location that sets ANY `add_header`
# of its own inherits NONE from the level above. `/assets/`, `/images/` and
# `location = /index.html` each set Cache-Control, so all three answered with no
# CSP, no X-Frame-Options and no nosniff — and every SPA route ends in an
# internal redirect to /index.html, so the one document where a CSP and
# frame-ancestors actually matter was the one that never carried them.
#
# A template: the image's entrypoint fills in the storage origin when the
# container starts (see nginx-storage-origin.envsh and the Dockerfile).
#
# Content-Security-Policy. `default-src 'self'` and then only what the app uses:
#   - style-src allows 'unsafe-inline' because the SPA sets inline styles in a
#     handful of places (the barcode label sizing, one panel padding). Removing
#     those is the right fix and is a code change, not a header change — it is
#     called out here rather than quietly permitted forever.
#   - img-src allows data: because barcodes are rendered to a canvas and read
#     back as data URIs for printing, and blob: for the intake photo preview.
#   - img-src and media-src name the object storage origin. Item photographs and
#     videos are presigned URLs on the bucket, which is another origin; without
#     it the vault and the market show broken images the moment this policy
#     actually reaches the page. Empty when nothing is configured.
#   - connect-src is 'self' on the assumption the API is served under the same
#     origin behind this proxy. If the API is on another origin, add it here
#     AND to the API's CORS_ORIGINS — the two have to agree.
#   - frame-ancestors 'none' is the clickjacking defence and the reason
#     X-Frame-Options below is only a fallback for older agents.
#
# HSTS is NOT here. TLS terminates at Caddy (infra/production/Caddyfile), and
# that is the one place it is set: two sources for one header is how a max-age
# gets accidentally lowered.
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${STORAGE_PUBLIC_ORIGIN}; media-src 'self' ${STORAGE_PUBLIC_ORIGIN}; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera is 'self' rather than empty: the intake bench photographs cards.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
