# =============================================================================
# The security headers, in one place, included by every location in nginx.conf.
# A location that sets any `add_header` of its own inherits none from the level
# above, and `/assets/`, `/images/` and `= /index.html` each set Cache-Control,
# so the headers cannot sit only at the `server` level.
#
# A template: the image's entrypoint fills in the storage origin when the
# container starts (see nginx-storage-origin.envsh and the Dockerfile).
#
# Content-Security-Policy. `default-src 'self'` and then only what the app uses:
#   - style-src allows 'unsafe-inline' for the SPA's inline styles.
#   - img-src allows data: for the two-factor QR code, which the API sends as
#     a data URL, and blob: for photo previews before upload.
#   - img-src and media-src name the object storage origin, because item
#     photographs and videos are presigned URLs on the bucket. Empty when
#     nothing is configured.
#   - connect-src is 'self' on the assumption the API is served under the same
#     origin behind this proxy. If the API is on another origin, add it here
#     and to the API's CORS_ORIGINS; the two have to agree.
#   - frame-ancestors 'none' is the clickjacking defence; X-Frame-Options below
#     is only a fallback for older agents.
#
# HSTS is set only at Caddy (infra/production/Caddyfile), where TLS terminates,
# so a single source controls its max-age.
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${STORAGE_PUBLIC_ORIGIN}; media-src 'self' ${STORAGE_PUBLIC_ORIGIN}; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera is 'self' rather than empty: the intake bench photographs cards.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
