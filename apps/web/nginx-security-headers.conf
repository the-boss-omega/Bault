# Security headers for every response the web image serves.
#
# Included by nginx.conf at server level and inside each location that sets its
# own add_header (nginx drops inherited add_header lines in any block that
# declares one). Keep every security header here and nowhere else.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Camera is 'self' rather than empty: the intake bench photographs cards.
