# =============================================================================
# Serving the Bault SPA.
#
# This file is where the Content-Security-Policy lives. `main.ts` disables CSP on
# the API with the note that "the CSP that matters belongs on whatever serves the
# front end" — and until now no such thing existed, so the product shipped with
# no CSP at all.
# =============================================================================

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the version to anybody scanning.
  server_tokens off;

  # ---------------------------------------------------------------------------
  # Content-Security-Policy.
  #
  # `default-src 'self'` and then only what the app actually uses:
  #   - style-src allows 'unsafe-inline' because the SPA sets inline styles in a
  #     handful of places (the barcode label sizing, one panel padding). Removing
  #     those is the right fix and is a code change, not a header change — it is
  #     called out here rather than quietly permitted forever.
  #   - img-src allows data: because barcodes are rendered to a canvas and read
  #     back as data URIs for printing.
  #   - connect-src is 'self' on the assumption the API is served under the same
  #     origin behind this proxy. If the API is on another origin, add it here
  #     AND to the API's CORS_ORIGINS — the two have to agree.
  #   - frame-ancestors 'none' is the clickjacking defence and the reason
  #     X-Frame-Options below is only a fallback for older agents.
  # ---------------------------------------------------------------------------
  # The security headers live in one file, included here AND in every location
  # that sets a header of its own. nginx does not merge add_header across
  # levels: a location with any add_header drops every server-level one. The
  # index.html, /assets/ and /images/ blocks each set Cache-Control — and `/`
  # and every SPA route fall through to index.html — so the CSP, nosniff and
  # frame protections were missing from nearly every response.
  include /etc/nginx/snippets/bault-security-headers.conf;

  # HSTS is set here only if TLS terminates at this container. Where it
  # terminates upstream (a load balancer), set it there instead and delete this
  # line — two sources for one header is how a max-age gets accidentally lowered.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # Caching, split by whether the filename carries a content hash.
  # ---------------------------------------------------------------------------

  # Vite emits hashed filenames into /assets, so those are immutable forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/bault-security-headers.conf;
    try_files $uri =404;
  }

  # Card photographs are named by item serial and are NOT content-hashed — a
  # re-shoot replaces the file at the same name. A day is long enough to be
  # worth having and short enough that a corrected photo appears.
  location /images/ {
    expires 1d;
    add_header Cache-Control "public" always;
    include /etc/nginx/snippets/bault-security-headers.conf;
    try_files $uri =404;
  }

  # index.html must never be cached: it is what points at the hashed bundles, so
  # a stale copy pins a browser to a deleted build.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    include /etc/nginx/snippets/bault-security-headers.conf;
  }

  # ---------------------------------------------------------------------------
  # The API, on the same origin.
  #
  # The SPA calls `/api/v1/...` relative to itself and the CSP above allows only
  # 'self' — but nothing here forwarded `/api`, so in the built image every API
  # call fell through to `location /` and got index.html back: a deployed site
  # that could not sign anybody in. `${API_UPSTREAM}` is filled in when the
  # container starts (the image's templates step; see the Dockerfile) and
  # defaults to http://api:3000.
  #
  # X-Forwarded-For is SET to the address nginx saw, not appended to, so a
  # client cannot smuggle one in ahead of it. The API must trust this hop
  # (`TRUST_PROXY`) or it records the container's address for everybody.
  # ---------------------------------------------------------------------------
  location /api/ {
    # RE-RESOLVE the upstream on every request, rather than once at startup.
    #
    # `proxy_pass http://api:3000` is a STATIC upstream: nginx resolves the name
    # when it loads its configuration and then caches that address for the life
    # of the process. Container addresses are not stable — recreating the API
    # (which every backend deploy does) gives it a new one — so nginx went on
    # proxying to an address that no longer existed and answered 502 Bad Gateway
    # for everything, with a perfectly healthy API sitting beside it.
    #
    # Naming a resolver and putting the upstream in a VARIABLE defers the lookup
    # to request time. 127.0.0.11 is Docker's embedded DNS, which is where a
    # container's service names are answered; `valid=10s` caps how long an answer
    # is cached. `$upstream$request_uri` is required with a variable: nginx only
    # passes the original URI unchanged when `proxy_pass` has no variable in it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bault_api ${API_UPSTREAM};
    proxy_pass $bault_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 25m;
  }

  # Client-side routing: every unknown path is the SPA, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
