# =============================================================================
# Serving the Bault SPA. This server sends the Content-Security-Policy (the
# policy itself is in nginx-security-headers.conf); `main.ts` disables CSP on
# the API because the one that matters belongs on whatever serves the front end.
# =============================================================================

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the version to anybody scanning.
  server_tokens off;

  # ---------------------------------------------------------------------------
  # Security headers: nginx-security-headers.conf, which explains each one.
  #
  # Included here and in every location below, because nginx does not merge
  # `add_header`: a location that sets any header of its own drops every one set
  # at this level. Any new location gets the include as its first line, whether
  # or not it adds a header today.
  #
  # The included file is rendered at container start from a template into
  # conf.d/bault/, a subdirectory, so the image's own `include conf.d/*.conf`
  # at http level does not load it a second time.
  # ---------------------------------------------------------------------------
  include /etc/nginx/conf.d/bault/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # Caching, split by whether the filename carries a content hash.
  # ---------------------------------------------------------------------------

  # Vite emits hashed filenames into /assets, so those are immutable forever.
  location /assets/ {
    include /etc/nginx/conf.d/bault/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # Card photographs are named by item serial and are not content-hashed, so a
  # re-shoot replaces the file at the same name. A day is long enough to be
  # worth having and short enough that a corrected photo appears.
  location /images/ {
    include /etc/nginx/conf.d/bault/security-headers.conf;
    expires 1d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
  }

  # index.html must never be cached: it is what points at the hashed bundles, so
  # a stale copy pins a browser to a deleted build.
  location = /index.html {
    include /etc/nginx/conf.d/bault/security-headers.conf;
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  # ---------------------------------------------------------------------------
  # The API, on the same origin: the SPA calls `/api/v1/...` relative to itself
  # and the CSP allows only 'self'. `${API_UPSTREAM}` is filled in when the
  # container starts (see the Dockerfile) and defaults to http://api:3000.
  #
  # X-Forwarded-For is appended to, which keeps the client's address. That is
  # safe because nothing reaches this container except through Caddy, which
  # overwrites whatever the client sent with the address it saw
  # (`header_up X-Forwarded-For {client_ip}`). The API trusts the docker network
  # (`TRUST_PROXY`), walks the list from the right past this hop and Caddy's,
  # and stops at the client.
  #
  # The upstream's own copies of the headers this server sets are hidden, so an
  # API response carries one value of each.
  # ---------------------------------------------------------------------------
  location /api/ {
    include /etc/nginx/conf.d/bault/security-headers.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 25m;
  }

  # Client-side routing: every unknown path is the SPA, not a 404.
  location / {
    include /etc/nginx/conf.d/bault/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
