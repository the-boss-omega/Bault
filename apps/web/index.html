<!doctype html>
<!--
  Hebrew-primary, full RTL shell.
  `lang="he"` + `dir="rtl"` set the document's base direction so the whole app
  lays out right-to-left by default; individual LTR fields (e.g. barcodes, emails)
  opt back in locally.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
