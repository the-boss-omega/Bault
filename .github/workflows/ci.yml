name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bault
          POSTGRES_PASSWORD: bault
          POSTGRES_DB: bault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bault -d bault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bault:bault@localhost:5432/bault
      DIRECT_DATABASE_URL: postgres://bault:bault@localhost:5432/bault
      SESSION_COOKIE_SECRET: ci-test-secret-value-1234567890
      PAYMENT_PROVIDER: sandbox
      NODE_ENV: test
      STORAGE_PROVIDER: s3
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: eu-central
      STORAGE_BUCKET: bault-images
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      API_PORT: 3000
      AUTH_RATE_LIMIT_PER_MINUTE: 5000
      RATE_LIMIT_PER_MINUTE: 20000
      MINIO_VERSION: v0.0.0-20250907161309-07c3a429bfed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore the MinIO build
        id: minio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/minio-bin
          key: minio-${{ runner.os }}-${{ runner.arch }}-${{ env.MINIO_VERSION }}

      - if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24'
          cache: false

      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio-bin" go install "github.com/minio/minio@${MINIO_VERSION}"

      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER="$STORAGE_ACCESS_KEY" MINIO_ROOT_PASSWORD="$STORAGE_SECRET_KEY" \
            nohup "$HOME/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || { cat "$RUNNER_TEMP/minio.log"; exit 1; }
          curl -sS --fail-with-body --aws-sigv4 "aws:amz:${STORAGE_REGION}:s3" \
            --user "${STORAGE_ACCESS_KEY}:${STORAGE_SECRET_KEY}" \
            -X PUT "http://localhost:9000/${STORAGE_BUCKET}"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the web app
        run: pnpm --filter @bault/web build

      - name: Web unit tests
        run: pnpm test:web

      - name: Environment schema tests
        run: pnpm test:config

      - name: Component & UX tests
        run: pnpm exec vitest run --project ux

      - name: Core contract tests
        run: pnpm test:core-contract

      - name: Adapter contract tests (payment, shipping, storage)
        run: pnpm test:contract

      - name: Database settings
        run: psql "$DIRECT_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f infra/postgres/dev-settings.sql

      - name: Migrate
        run: pnpm --filter @bault/api db:migrate

      - name: Start the API
        run: |
          pnpm --filter @bault/api build
          node apps/api/dist/main.js &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v1/readyz > /dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 60s"; exit 1

      - name: Integration tests
        run: |
          pnpm --filter @bault/api db:seed
          pnpm test:integration

      - name: Core tests
        run: |
          pnpm --filter @bault/api db:seed
          pnpm test:core

      - name: Concurrency tests (no double-sale / single owner)
        run: |
          pnpm --filter @bault/api db:seed
          pnpm test:concurrency

      - name: Property tests (balance == sum ledger)
        run: |
          pnpm --filter @bault/api db:seed
          pnpm test:property

      - name: Worker tests (idempotent jobs, shutdown, heartbeat)
        run: |
          pnpm --filter @bault/api db:seed
          pnpm test:worker

      - name: Stop the API
        if: always()
        run: kill "$(cat /tmp/api.pid)" || true

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          package-manager-cache: false
      - name: pnpm audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level=high

  migrate-image:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bault
          POSTGRES_PASSWORD: bault
          POSTGRES_DB: bault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bault -d bault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bault:bault@localhost:5432/bault
      DIRECT_DATABASE_URL: postgres://bault:bault@localhost:5432/bault
      NODE_ENV: test
      PAYMENT_PROVIDER: sandbox
      STORAGE_PROVIDER: sandbox
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: eu-central
      STORAGE_BUCKET: bault-images
      STORAGE_ACCESS_KEY: ci-unused
      STORAGE_SECRET_KEY: ci-unused

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t bault-api:ci .

      - name: Migrate an empty database with the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL -e DIRECT_DATABASE_URL -e NODE_ENV \
            -e PAYMENT_PROVIDER -e STORAGE_PROVIDER -e STORAGE_ENDPOINT -e STORAGE_REGION \
            -e STORAGE_BUCKET -e STORAGE_ACCESS_KEY -e STORAGE_SECRET_KEY \
            bault-api:ci node dist/db/migrate.js

      - name: The append-only guards are installed
        run: |
          triggers="$(psql "$DIRECT_DATABASE_URL" -At -c "
            SELECT count(*) FROM pg_trigger
             WHERE NOT tgisinternal
               AND (tgname LIKE 'trg_append_only_%' OR tgname = 'trg_no_delete_item');")"
          operators="$(psql "$DIRECT_DATABASE_URL" -At -c "
            SELECT count(*) FROM pg_operator
             WHERE oprname IN ('=', '<>')
               AND (oprleft, oprright) IN (('uuid'::regtype, 'text'::regtype), ('text'::regtype, 'uuid'::regtype));")"
          echo "guard triggers: ${triggers} (expected 11), uuid/text operators: ${operators} (expected 4)"
          psql "$DIRECT_DATABASE_URL" -c "SELECT tgrelid::regclass AS table, tgname FROM pg_trigger WHERE NOT tgisinternal ORDER BY 1, 2;"
          [ "$triggers" = "11" ] && [ "$operators" = "4" ]

      - name: The migration wrote one platform custodian, and a second run adds none
        run: |
          count_platform() {
            psql "$DIRECT_DATABASE_URL" -At -c "SELECT count(*) FROM user_account WHERE email = 'platform@bault.dev';"
          }
          first="$(count_platform)"
          psql "$DIRECT_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f apps/api/src/db/migrations/0038_every_database_has_its_platform_custodian.sql
          again="$(count_platform)"
          echo "platform custodians: ${first} after migrating, ${again} after 0038 again (expected 1 and 1)"
          [ "$first" = "1" ] && [ "$again" = "1" ]

      - name: The image creates the first administrator once, and refuses a second
        run: |
          password="$(openssl rand -base64 24)"
          create_admin() {
            printf '%s\n' "$password" | docker run --rm -i --network host \
              -e DATABASE_URL -e DIRECT_DATABASE_URL -e NODE_ENV \
              -e PAYMENT_PROVIDER -e STORAGE_PROVIDER -e STORAGE_ENDPOINT -e STORAGE_REGION \
              -e STORAGE_BUCKET -e STORAGE_ACCESS_KEY -e STORAGE_SECRET_KEY \
              bault-api:ci node dist/db/create-admin.js \
              --email "$1@example.com" --username "$1" --first-name CI --last-name Admin
          }
          create_admin first
          if create_admin second; then
            echo "a second administrator was created"
            exit 1
          fi
          admins="$(psql "$DIRECT_DATABASE_URL" -At -c "SELECT string_agg(username, ',') FROM user_account WHERE role = 'admin';")"
          echo "administrators: ${admins} (expected first)"
          [ "$admins" = "first" ]

  cloud-sql-privileges:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bault
          POSTGRES_PASSWORD: bault
          POSTGRES_DB: bault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bault -d bault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ADMIN_URL: postgres://bault:bault@localhost:5432/postgres
      OWNER_URL: postgres://bault_owner:ci-owner-password@localhost:5432/bault_gcp
      APP_URL: postgres://bault_app:ci-app-password@localhost:5432/bault_gcp
      WORKER_URL: postgres://bault_worker:ci-worker-password@localhost:5432/bault_gcp
      NODE_ENV: test
      PAYMENT_PROVIDER: sandbox
      STORAGE_PROVIDER: sandbox
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: auto
      STORAGE_BUCKET: bault-images
      STORAGE_ACCESS_KEY: ci-unused
      STORAGE_SECRET_KEY: ci-unused

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t bault-api:ci .

      - name: The roles Cloud SQL creates, and no superuser
        env:
          BAULT_OWNER_PASSWORD: ci-owner-password
        run: psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -v dbname=bault_gcp -f infra/gcp/cloudsql-emulate.sql

      - name: The owner takes over its database
        run: psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 -f infra/gcp/claim-database.sql

      - name: Migrate with the image, as the owner
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$OWNER_URL" -e DIRECT_DATABASE_URL="$OWNER_URL" -e NODE_ENV \
            -e PAYMENT_PROVIDER -e STORAGE_PROVIDER -e STORAGE_ENDPOINT -e STORAGE_REGION \
            -e STORAGE_BUCKET -e STORAGE_ACCESS_KEY -e STORAGE_SECRET_KEY \
            bault-api:ci node dist/db/migrate.js

      - name: roles.sql as the owner, then again
        env:
          BAULT_APP_PASSWORD: ci-app-password
          BAULT_WORKER_PASSWORD: ci-worker-password
        run: |
          psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 -f infra/production/roles.sql
          psql "$OWNER_URL" -X -q -v ON_ERROR_STOP=1 -f infra/production/roles.sql > /dev/null

      - name: The application roles are the ones production needs
        run: |
          [ "$(psql "$APP_URL" -XAtc 'show statement_timeout')" = 30s ]
          [ "$(psql "$WORKER_URL" -XAtc 'show statement_timeout')" = 30s ]
          if psql "$APP_URL" -XAtc 'update ledger_record set amount = amount where false' 2> /dev/null; then
            echo "bault_app may update the ledger"; exit 1
          fi
          psql "$WORKER_URL" -X -v ON_ERROR_STOP=1 -c 'create table pgboss.ci_probe (x int)' -c 'drop table pgboss.ci_probe'
          supers="$(psql "$ADMIN_URL" -XAtc "select count(*) from pg_roles where rolsuper and rolname in ('bault_owner', 'bault_app', 'bault_worker')")"
          [ "$supers" = 0 ]

  secret-scan:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --exit-code 1 .'
