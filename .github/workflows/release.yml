name: Release

# Pushing a tag `v*` builds the three images and publishes them to GHCR:
#
#   ghcr.io/<owner>/bault-api:<tag>     and :sha-<commit>
#   ghcr.io/<owner>/bault-worker:<tag>  and :sha-<commit>
#   ghcr.io/<owner>/bault-web:<tag>     and :sha-<commit>
#
# The git tag is what infra/production/compose.yml deploys (BAULT_TAG) and what
# deploy.yml takes as input; the commit tag says exactly which source an image
# was built from, so the three images of one release can be checked to come
# from the same commit. No `latest`: a deployment names the release it runs, and
# a rollback is a deployment of the previous tag.
#
# Tag a commit that CI passed on master:
#   git tag v0.1.0-rc1 && git push origin v0.1.0-rc1
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

# One release build per tag; a re-push of the same tag waits rather than racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # If one image fails the others still finish, but the release is
      # incomplete and deploy.sh refuses it: `docker compose pull` needs all
      # three tags before it changes anything on the host.
      fail-fast: false
      matrix:
        include:
          - image: bault-api
            dockerfile: apps/api/Dockerfile
          - image: bault-worker
            dockerfile: apps/worker/Dockerfile
          - image: bault-web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # GHCR names must be lower case; an owner name need not be.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.ref }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
