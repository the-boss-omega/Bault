name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          WAIT_MINUTES: 70
        run: |
          start=$(date +%s)
          deadline=$(( start + WAIT_MINUTES * 60 ))
          while :; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
                    | jq -c '[.workflow_runs[] | {id, event, status, conclusion}]')"
            echo "CI runs on ${SHA}: ${runs}"
            if [ "$runs" = "[]" ] && [ $(( $(date +%s) - start )) -lt 120 ]; then
              sleep 15
              continue
            fi
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed on ${SHA}"
              exit 0
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<< "$runs" > /dev/null; then
              echo "::error::CI has not passed on ${SHA} (no successful run of ci.yml, none still running). Fix it on master and tag the commit CI passed."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI was still running on ${SHA} after ${WAIT_MINUTES} minutes. Re-run this workflow once it has passed."
              exit 1
            fi
            sleep 30
          done

  images:
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bault-api
            dockerfile: apps/api/Dockerfile
          - image: bault-worker
            dockerfile: apps/worker/Dockerfile
          - image: bault-web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.name.outputs.ref }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
